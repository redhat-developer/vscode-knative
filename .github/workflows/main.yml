name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    # Codecov authenticates uploads with a short-lived OIDC token instead of the
    # long-lived CODECOV_TOKEN secret. Fork PRs cannot request an id-token, so
    # they keep using Codecov's tokenless path (owner:branch) as before.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - name: Run headless test
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
      - name: Run UI tests
        if: runner.os == 'Linux'
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run base-ui-test
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.os }}
          path: 'test-resources/**/screenshots/*.png'
          retention-days: 2
          if-no-files-found: warn
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 #v4.6.0
        name: codecov-upload
        with:
          files: ./coverage/coverage-final.json
          use_oidc: true
